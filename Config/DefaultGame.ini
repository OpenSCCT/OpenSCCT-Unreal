[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=OpenSCCT Unreal
CompanyName=Lumbridge
ProjectVersion=0.1.12

; The editor's MCP toolsets (AllToolsets) bring the GameFeatures plugin into the editor, and it reports an error, which
; fails a cook, unless the asset manager has a rule for its asset type that differs from FPrimaryAssetRules' defaults
; (a rule of all defaults counts as none), hence CookRule=NeverCook. The game has no game features: editor only.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=NeverCook))

; A release build (Tools/Package-Release.ps1, docs/RELEASING.md) cooks this project's own content and the content
; imported in the editor on the release machine: the enhanced maps (/Game/Imported/Maps/<Map>/<Map>.umap, relit and
; re-surfaced in Unreal) and the characters, weapons and effects under /Game/Imported they use. /Game/Imported is
; git-ignored local import output. A map without an imported level is still built at run time from the Steam conversion.
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
BuildTarget=OpenSCCTUnreal
ForDistribution=True
IncludeDebugFiles=False
UsePakFile=True
bUseIoStore=True
bCompressed=True
bShareMaterialShaderCode=True
; The shared shader library in hash order, not cook order: unchanged shaders keep their place from one release to the
; next, so the launcher's binary patches stay small.
bDeterministicShaderCodeOrder=True
; The Visual C++ runtime installer ships next to the game instead (Package-Release.ps1); the engine's own
; prerequisites installer is not part of this engine install.
IncludePrerequisites=False
IncludeCrashReporter=False
InternationalizationPreset=English
+CulturesToStage=en
bSkipEditorContent=True
+MapsToCook=(FilePath="/Game/OpenSCCT/Maps/L_FrontEnd")
; Opened by path (UScctOnlineSubsystem::RuntimeLevel) to build every converted map at run time. Listed here because
; DirectoriesToAlwaysCook below only collects .uasset files, never .umap: without this line no release has the level,
; DoesPackageExist fails for it and the home page says no map can be played.
+MapsToCook=(FilePath="/Game/OpenSCCT/RuntimeMap/L_RuntimeMap")
; Loaded by path at run time (the weapon table, the goggles, the effect and surface materials), so cooked whether
; or not a level refers to them.
+DirectoriesToAlwaysCook=(Path="/Game/OpenSCCT")
; The glTF loader opens its material templates by path when it creates local skeletal meshes.
+DirectoriesToAlwaysCook=(Path="/glTFRuntime")
; The imported content: the maps' assets, and the characters, weapons and effects the game loads by path at run time
; (ScctRuntimeSkins, ScctEffectsProjections), which no level refers to. The cooker only looks for .uasset files in
; these folders, never .umap, so Package-Release.ps1 passes the map levels themselves (-MapsToCook).
+DirectoriesToAlwaysCook=(Path="/Game/Imported/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/Imported/Chars")
+DirectoriesToAlwaysCook=(Path="/Game/Imported/Fx")

[OpenSCCT.MapPacks]
; Revision used by the local developer map-pak cook.
CookRevision=1

